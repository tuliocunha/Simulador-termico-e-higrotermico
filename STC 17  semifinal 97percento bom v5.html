            // Handle updates based on selectedZona
            if (isMapValue(selectedZona)) {
                // Logic when MAPA is selected
                lastValidZona = selectedZona;
                // Additional logic to open map or similar
            }
        }
    </script>
</head>
<body>
    <h1>Simulador Térmico e Higrotermico</h1>
    <div>
