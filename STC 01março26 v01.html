<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Termico e Higrotermico</title>
</head>
<body>
    <script>
        let ITE50_CATALOG = [];

        function parseCSV(text) {
            const rows = text.split('\n');
            return rows.map(row => row.split(','));
        }

        async function loadIte50Catalog() {
            const response = await fetch('./ite50_catalog.csv', { cache: 'no-store' });
            const text = await response.text();
            ITE50_CATALOG = parseCSV(text);
        }

        async function init() {
            updateLockFromProfileName();
            await loadIte50Catalog();
            renderCategoriaSelect();
        }

        function isMapValue(v) {
            return v === "MAPA";
        }

        // Code to update the zonaClimatica <select>
        const zonaClimaticaSelect = document.getElementById('zonaClimatica');
        zonaClimaticaSelect.innerHTML = '<option value="I">I</option>' +
            '<option value="II">II</option>' +
            '<option value="III">III</option>' +
            '<option value="IV">IV</option>' +
            '<option value="MAPA">Localizar em mapa</option>';

    </script>
</body>
</html>
