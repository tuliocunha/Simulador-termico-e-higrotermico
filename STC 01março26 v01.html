<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Térmico e Higrotermico</title>
    <script>
        let ITE50_CATALOG;

        async function parseCSV(text) {
            const rows = text.split('\n').map(row => row.split(','));
            return rows;
        }

        async function loadIte50Catalog() {
            const response = await fetch('./ite50_catalog.csv');
            const text = await response.text();
            ITE50_CATALOG = await parseCSV(text);
        }

        async function init() {
            await loadIte50Catalog();
            renderCategoriaSelect();
            renderMaterialSelectByCategoria();
            applyMaterialMode();
        }

        function isMapValue(v) {
            return v === "MAPA";
        }

        function closeZonaMapa() {
            // Additional logic to close map
            zonaClimaticaSelect.value = 'I'; // reset to 'I'
        }
        
        // Zona Climática select options
        const zonaClimaticaOptions = ['I', 'II', 'III', 'IV', 'MAPA'];
        const zonaClimaticaSelect = document.getElementById('zonaClimatica');

        zonaClimaticaOptions.forEach(option => {
            const opt = document.createElement('option');
            opt.value = option;
            opt.innerHTML = option;
            zonaClimaticaSelect.appendChild(opt);
        });

        // Change handler for zonaClimatica
        zonaClimaticaSelect.addEventListener('change', function() {
            if (isMapValue(this.value)) {
                closeZonaMapa();
            }
            // Other logic can remain intact
        });

        document.addEventListener('DOMContentLoaded', () => { 
            init(); 
        });
    </script>
</head>
<body>
    <select id="zonaClimatica"></select>
    <!-- Rest of the UI here -->
</body>
</html>
